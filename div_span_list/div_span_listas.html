<!DOCTYPE html>
<html>
    <body>
        <h1>Título</h1>
        <div>
            <h2>Exemplo</h2>
            <p>Dentro do elemento DIV</p>
        </div>
        <p>Parágrafo fora do elemento DIV
            que contém um elemento
            <span>SPAN</span>.
        </p>

        <h4>Lista não ordenada:</h4>
        <ul>
            <li>Item A</li>
            <li>Item B</li>
            <li>Item C</li>
        </ul>

        <h4>Lista ordenada:</h4>
        <ol>
            <li>Item A</li>
            <li>Item B</li>
            <li>Item C</li>
        </ol>
    </body>
</html>
